:root { --bg: #0b0e12; --ink: #e8eef4; --dim: #8796a5; --amber: #ffb020; --red: #ff5a47; }

html { background: var(--bg); color: var(--ink); font: 17px/1.55 'Bricolage Grotesque', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
main { width: min(620px, 100%); }

h1 b { color: var(--red); font-weight: inherit; }
p { color: #c3ced9; margin: 0 0 22px; }
pre { font: 13px/1.7 'JetBrains Mono', ui-monospace, monospace; background: #0d1117; border: 1px solid #263240; border-radius: 12px; padding: 14px 16px; color: #b9c6d3; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 26px; }
.dim { color: var(--dim); }
a { display: inline-block; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; text-decoration: none; font-weight: 600; }
